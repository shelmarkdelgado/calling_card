<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08111f" />
    <meta name="description" content="XZAI digital business card" />
    <title>XZAI Digital Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="profile-card" aria-live="polite">
        <div class="ambient ambient-one"></div>
        <div class="ambient ambient-two"></div>

        <div id="loading" class="status-panel">Loading profile…</div>

        <div id="profile" class="profile-content" hidden>
          <header class="profile-header">
            <div id="avatar" class="avatar" aria-label="Profile photo"></div>
            <p id="brand" class="brand">XZAI · DIGITAL IDENTITY</p>
            <h1 id="name"></h1>
            <p id="role" class="role" hidden></p>
            <p id="bio" class="bio" hidden></p>
          </header>

          <button id="save-contact" class="save-contact" type="button">
            <span class="button-icon" aria-hidden="true">↓</span>
            Save Contact
          </button>

          <div id="primary-actions" class="primary-actions" aria-label="Contact actions"></div>
          <div id="details" class="details" hidden></div>

          <section id="social-section" class="link-section" hidden>
            <h2>Connect</h2>
            <div id="social-links" class="social-grid"></div>
          </section>

          <section id="custom-section" class="link-section" hidden>
            <h2>Links</h2>
            <div id="custom-links" class="custom-links"></div>
          </section>

          <footer class="footer">Powered by <strong>XZAI</strong></footer>
        </div>
      </section>
    </main>

    <template id="action-template">
      <a class="action-link"><span class="action-icon" aria-hidden="true"></span><span class="action-label"></span></a>
    </template>
    <template id="social-template">
      <a class="social-link"><span class="social-icon" aria-hidden="true"></span><span class="social-label"></span></a>
    </template>
    <template id="custom-template">
      <a class="custom-link"><span class="custom-title"></span><span aria-hidden="true">↗</span></a>
    </template>

    <script src="script.js"></script>
  </body>
</html>
